{% load static %}
<header class="sticky top-0 z-50 border-b border-neutral-200 bg-white shadow-nav">
  <div class="container mx-auto flex min-h-20 items-center gap-6 px-4">
    <a class="shrink-0 rounded-sm" href="/#inicio" aria-label="Global Business IT, inicio">
      <img src="{% static 'images/brand/logo-gbit.png' %}" alt="Global Business IT Corp" width="154" height="40" class="h-10 w-auto object-contain">
    </a>

    <nav class="hidden flex-1 justify-end lg:flex" aria-label="Navegación principal">
      <ul class="flex flex-wrap items-center justify-end gap-x-5 gap-y-2">
        {% for label, href in public_navigation %}
          <li><a class="rounded-sm py-3 text-sm font-semibold text-neutral-700 transition-colors hover:text-brand-blue focus-visible:text-brand-blue" href="{{ href }}">{{ label }}</a></li>
        {% endfor %}
      </ul>
    </nav>

    <button type="button" class="ml-auto inline-flex min-h-11 min-w-11 items-center justify-center rounded-md border border-neutral-300 text-brand-deep focus-visible:outline-offset-2 lg:hidden" aria-label="Abrir menú" aria-controls="mobile-navigation" aria-expanded="false" data-menu-toggle hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>

  <nav id="mobile-navigation" class="border-t border-neutral-200 bg-white px-4 py-3 lg:hidden" aria-label="Navegación móvil" data-mobile-navigation>
    <ul class="container mx-auto flex flex-col divide-y divide-neutral-100">
      {% for label, href in public_navigation %}
        <li><a class="block min-h-11 rounded-sm py-3 text-base font-semibold text-neutral-700 hover:text-brand-blue focus-visible:text-brand-blue" href="{{ href }}">{{ label }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
